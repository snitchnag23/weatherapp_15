<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Weather App</h1>
    <form class="search" id="search-form">
      <input type="text" id="city-input" placeholder="Type a city name" aria-label="City name" autocomplete="off">
      <button type="submit">Search</button>
    </form>
    <p class="hint" id="message">Type a city above and press Search.</p>
    <section class="result" id="result" hidden>
      <div class="hero">
        <div class="place">
          <h2 id="place"></h2>
          <p class="time" id="time"></p>
        </div>
        <div class="now">
          <img class="icon" id="icon" alt="">
          <span class="temp" id="temp"></span>
        </div>
        <p class="desc" id="desc"></p>
      </div>
      <div class="tiles">
        <div class="tile"><span class="label">Feels like</span><span class="value" id="feels"></span></div>
        <div class="tile"><span class="label">Humidity</span><span class="value" id="humidity"></span></div>
        <div class="tile"><span class="label">Wind</span><span class="value" id="wind"></span></div>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
