<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mockup - Dusk Panel</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e6e6e6;color:#222;font-family:Arial,Helvetica,sans-serif}
.sheet{padding:24px}
.sheet h1.title{margin:0 0 4px;font-size:1.5rem}
.sheet p.note{margin:0 0 24px;color:#444}
.state{margin-bottom:40px}
.state h2.state-title{margin:0 0 12px;font-size:1.2rem}
.pair{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
figure{margin:0;flex:none}
figcaption{font-size:.85rem;color:#444;margin-bottom:6px}
.frame{container-type:inline-size;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.frame.laptop{width:960px}
.frame.phone{width:375px}

.frame{background:#2a1630}
.app{padding:24px 16px 32px;color:#fbeedd}
.app h1{margin:0 0 16px;font-size:1.1rem;letter-spacing:.2em;text-transform:uppercase;color:#ffb347}
.search{display:flex;gap:8px;margin-bottom:24px}
.search input{flex:1;min-width:0;padding:12px;border:1px solid #6b4577;background:#3d2247;color:#fbeedd;font-size:1rem}
.search input::placeholder{color:#c4aad0}
.search button{padding:12px 20px;border:0;background:#ffb347;color:#2a1630;font-size:1rem;font-weight:bold}
.hint{color:#c4aad0;margin:0}
.msg{margin:0;padding:16px;background:#3d2247;border-left:4px solid #ffb347;font-size:1.05rem}
.loading{color:#ffb347;font-weight:bold}
.result{display:grid;gap:12px}
.hero,.tile{background:#3d2247}
.hero{padding:24px}
.place h2{margin:0;font-size:1.4rem}
.time{margin:4px 0 0;color:#c4aad0}
.now{display:flex;align-items:center;gap:12px;margin-top:16px}
.icon{font-size:3.5rem}
.temp{font-size:4.5rem;font-weight:bold;color:#ffb347;line-height:1}
.desc{margin:8px 0 0;font-size:1.2rem}
.tiles{display:grid;gap:12px}
.tile{padding:16px 20px;display:flex;justify-content:space-between;align-items:baseline}
.label{color:#c4aad0}
.value{font-size:1.4rem;font-weight:bold}
@container (min-width:640px){
 .app{padding:48px 64px 64px}
 .app h1{font-size:1.3rem}
 .search{max-width:560px}
 .result{grid-template-columns:1.2fr 1fr;gap:16px}
 .hero{padding:40px}
 .temp{font-size:6rem}.icon{font-size:4.5rem}
 .tiles{grid-template-rows:repeat(3,1fr);gap:16px}
 .tile{padding:24px}
 .value{font-size:1.6rem}
}
</style>
</head>
<body>
<div class="sheet">
<h1 class="title">Mockup: Dusk Panel</h1>
<p class="note">Dark plum background with a glowing amber accent, two panels on a laptop. Design only: nothing here works yet. All weather values are made up.</p>
<section class="state"><h2 class="state-title">1. Before searching</h2><div class="pair">
<figure><figcaption>Laptop size (960 px wide)</figcaption><div class="frame laptop"><div class="app"><h1>Weather App</h1><div class="search"><input type="text" placeholder="Type a city name" value="" readonly aria-label="City name"><button type="button">Search</button></div><p class="hint">Type a city above and press Search.</p></div></div></figure>
<figure><figcaption>Phone size (375 px wide)</figcaption><div class="frame phone"><div class="app"><h1>Weather App</h1><div class="search"><input type="text" placeholder="Type a city name" value="" readonly aria-label="City name"><button type="button">Search</button></div><p class="hint">Type a city above and press Search.</p></div></div></figure>
</div></section>
<section class="state"><h2 class="state-title">2. Loading</h2><div class="pair">
<figure><figcaption>Laptop size (960 px wide)</figcaption><div class="frame laptop"><div class="app"><h1>Weather App</h1><div class="search"><input type="text" placeholder="Type a city name" value="London" readonly aria-label="City name"><button type="button">Search</button></div><p class="msg loading">Loading...</p></div></div></figure>
<figure><figcaption>Phone size (375 px wide)</figcaption><div class="frame phone"><div class="app"><h1>Weather App</h1><div class="search"><input type="text" placeholder="Type a city name" value="London" readonly aria-label="City name"><button type="button">Search</button></div><p class="msg loading">Loading...</p></div></div></figure>
</div></section>
<section class="state"><h2 class="state-title">3. Weather result</h2><div class="pair">
<figure><figcaption>Laptop size (960 px wide)</figcaption><div class="frame laptop"><div class="app"><h1>Weather App</h1><div class="search"><input type="text" placeholder="Type a city name" value="London" readonly aria-label="City name"><button type="button">Search</button></div><section class="result"><div class="hero"><div class="place"><h2>London, United Kingdom</h2><p class="time">Sunday, 15 Nov &middot; 14:30</p></div><div class="now"><span class="icon" role="img" aria-label="Partly cloudy">&#9925;</span><span class="temp">24&deg;C</span></div><p class="desc">Partly cloudy</p></div><div class="tiles"><div class="tile"><span class="label">Feels like</span><span class="value">26&deg;C</span></div><div class="tile"><span class="label">Humidity</span><span class="value">58%</span></div><div class="tile"><span class="label">Wind</span><span class="value">14 km/h NW</span></div></div></section></div></div></figure>
<figure><figcaption>Phone size (375 px wide)</figcaption><div class="frame phone"><div class="app"><h1>Weather App</h1><div class="search"><input type="text" placeholder="Type a city name" value="London" readonly aria-label="City name"><button type="button">Search</button></div><section class="result"><div class="hero"><div class="place"><h2>London, United Kingdom</h2><p class="time">Sunday, 15 Nov &middot; 14:30</p></div><div class="now"><span class="icon" role="img" aria-label="Partly cloudy">&#9925;</span><span class="temp">24&deg;C</span></div><p class="desc">Partly cloudy</p></div><div class="tiles"><div class="tile"><span class="label">Feels like</span><span class="value">26&deg;C</span></div><div class="tile"><span class="label">Humidity</span><span class="value">58%</span></div><div class="tile"><span class="label">Wind</span><span class="value">14 km/h NW</span></div></div></section></div></div></figure>
</div></section>
<section class="state"><h2 class="state-title">4. City not found</h2><div class="pair">
<figure><figcaption>Laptop size (960 px wide)</figcaption><div class="frame laptop"><div class="app"><h1>Weather App</h1><div class="search"><input type="text" placeholder="Type a city name" value="Londno" readonly aria-label="City name"><button type="button">Search</button></div><p class="msg">&#128269; Sorry, I couldn't find that city. Please check the spelling and try again.</p></div></div></figure>
<figure><figcaption>Phone size (375 px wide)</figcaption><div class="frame phone"><div class="app"><h1>Weather App</h1><div class="search"><input type="text" placeholder="Type a city name" value="Londno" readonly aria-label="City name"><button type="button">Search</button></div><p class="msg">&#128269; Sorry, I couldn't find that city. Please check the spelling and try again.</p></div></div></figure>
</div></section>
</div>
</body>
</html>
